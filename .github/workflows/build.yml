name: Build Bedrock Client Library

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bedrock-client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android ARM64 Library
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install CMake and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Configure Android NDK
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          test -f "$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake"

      - name: Configure ARM64 build
        run: |
          cmake -S . -B build-android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release

      - name: Compile shared library
        run: cmake --build build-android --parallel 2

      - name: Verify output
        run: |
          test -f build-android/libbedrock_client.so
          file build-android/libbedrock_client.so

      - name: Upload Android library
        uses: actions/upload-artifact@v4
        with:
          name: bedrock-client-android-arm64
          path: build-android/libbedrock_client.so
          if-no-files-found: error
          retention-days: 14

  desktop-test:
    name: Desktop Core Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build library
        run: cmake --build build --parallel 2

      - name: Compile test executable
        run: |
          c++ -std=c++20 -Wall -Wextra -Wpedantic \
            -Iinclude example/main.cpp src/client.cpp \
            -o bedrock_client_test

      - name: Run tests
        run: ./bedrock_client_test
